<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>INKSPARK – finish your own poem</title>
  <meta name="description" content="Write the first line of a poem. INKSPARK helps you find the rest." />
  <meta property="og:title" content="INKSPARK – finish your own poem" />
  <meta property="og:description" content="Every great story begins with an idea. Write the first line; get a spark for the rest." />
  <meta name="theme-color" content="#231012" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="/" aria-label="INKSPARK home">
        <svg class="nib" viewBox="0 0 40 48" aria-hidden="true">
          <path d="M14 4h10l6 16-11 24L8 20z" fill="currentColor" />
          <path d="M19 20v20" stroke="var(--bg)" stroke-width="1.6" />
          <circle cx="19" cy="20" r="2.6" fill="var(--bg)" />
          <path d="M33 2l1.4 3.6L38 7l-3.6 1.4L33 12l-1.4-3.6L28 7l3.6-1.4z" fill="var(--gold)" />
        </svg>
        <span class="word">INK<span>SPARK</span></span>
      </a>
      <button class="ghost-btn" id="newChat" type="button">+ New chat</button>
    </header>

    <section class="intro" id="intro">
      <h1>Every great story begins with an idea. Sometimes, all it needs is a little help finding its words!</h1>
      <p class="tag">A spark that helps turn an idea into writing!</p>
      <p class="hint">Try one of these, or write your own:</p>
      <div class="chips">
        <button type="button" class="chip" data-text="Your old umbrella&#10;still hangs by the door">Your old umbrella / still hangs by the door</button>
        <button type="button" class="chip" data-text="Dust on the piano&#10;one key still remembers">Dust on the piano / one key still remembers</button>
        <button type="button" class="chip" data-text="Words: moon, train, letter. Tone: hopeful">Words: moon, train, letter. Tone: hopeful</button>
      </div>
      <p class="legend">Your lines stay as you wrote them. <mark class="sugg">highlighted</mark> lines are my suggestions.</p>
    </section>

    <main class="thread" id="thread" aria-live="polite"></main>

    <footer class="composer">
      <div class="controls">
        <label>Help me
          <select id="mode">
            <option value="auto">Choose for me</option>
            <option value="continue">Continue the poem</option>
            <option value="ending">Write an ending</option>
            <option value="rhyme">Make it rhyme</option>
            <option value="vivid">Add vivid imagery</option>
            <option value="twist">Take a surprising turn</option>
          </select>
        </label>
        <label>Lines to add
          <select id="count">
            <option value="2">1–2</option>
            <option value="3" selected>3–4</option>
            <option value="6">5–6</option>
          </select>
        </label>
        <label>Voice
          <select id="voice">
            <option>English</option>
            <option>Hindi</option>
            <option>Hinglish</option>
            <option>Urdu</option>
            <option>Bengali</option>
          </select>
        </label>
      </div>
      <div id="attachment" class="attachment" hidden></div>
      <form class="input-row" id="form">
        <textarea id="input" rows="2" placeholder="Write your first line here… I'll help with the rest" aria-label="Your lines"></textarea>
        <button type="button" class="icon-btn" id="poemBtn" title="See your whole poem" aria-label="See your whole poem">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16zM14 6l3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        </button>
        <label class="icon-btn" title="Start from a picture" aria-label="Start from a picture">
          <input type="file" id="image" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3 16l5-5 4 4 3-3 6 6" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="16" cy="9" r="1.6" fill="currentColor"/></svg>
        </label>
        <button type="submit" class="spark-btn" id="spark">Spark</button>
      </form>
      <p class="status" id="status" role="status"></p>
    </footer>
  </div>

  <dialog id="poemDialog">
    <h2 id="poemTitle">Your poem</h2>
    <pre id="poemText"></pre>
    <div class="dialog-actions">
      <button type="button" class="ghost-btn" id="copyPoem">Copy</button>
      <button type="button" class="ghost-btn" id="downloadPoem">Download .txt</button>
      <button type="button" class="spark-btn" id="closePoem">Close</button>
    </div>
  </dialog>

  <script src="/app.js" type="module"></script>
</body>
</html>
